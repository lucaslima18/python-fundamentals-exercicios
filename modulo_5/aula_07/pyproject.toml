[project]
name = "rastreador-de-ki"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "questionary>=2.1.1",
    "rich>=15.0.0",
]

[project.scripts]
rastreador-de-ki = "rastreador_de_ki:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
]

[tool.mypy]
python_version=3.14
files=["src"]
ignore_missing_imports=true
strict=true

[tool.ruff]
line-length = 165
